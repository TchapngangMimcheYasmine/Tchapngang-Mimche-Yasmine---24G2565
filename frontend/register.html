<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpenseTracker by Yasmine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      display: flex; align-items: center; justify-content: center; color: white;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 40px; width: 100%; max-width: 400px;
    }
    h2 { text-align: center; margin-bottom: 5px; font-size: 1.8rem; color: #e94560; }
    .sub { text-align: center; color: #aaa; font-size: 0.8rem; margin-bottom: 25px; }
    input {
      width: 100%; padding: 12px 15px; margin-bottom: 15px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05); color: white; font-size: 1rem;
    }
    input::placeholder { color: #aaa; }
    button {
      width: 100%; padding: 13px; border-radius: 10px; border: none;
      background: #e94560; color: white; font-size: 1rem; font-weight: bold;
      cursor: pointer; transition: 0.3s;
    }
    button:hover { opacity: 0.8; }
    .link { text-align: center; margin-top: 15px; color: #aaa; font-size: 0.9rem; }
    .link a { color: #e94560; text-decoration: none; }
    .message { text-align: center; margin-top: 10px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>💰 ExpenseTracker</h2>
    <p class="sub">by Yasmine</p>
    <input type="text" id="nom" placeholder="" />
    <input type="email" id="email" placeholder="" />
    <input type="password" id="mot_de_passe" placeholder="" />
    <button onclick="inscrire()" id="btn-submit"></button>
    <div class="message" id="message"></div>
    <div class="link" id="lien-login"></div>
  </div>
  <script>
    const API = 'https://tchapngang-mimche-yasmine-24g2565-0m0r.onrender.com/api';
    const langue = localStorage.getItem('langue') || 'fr';

    const t = {
      fr: {
        nom: 'Votre nom', email: 'Votre email', mdp: 'Mot de passe',
        btn: "S'inscrire",
        lien: 'Déjà un compte ? <a href="login.html">Se connecter</a>',
        succes: 'Compte créé avec succès !',
        erreur: 'Erreur de connexion au serveur'
      },
      en: {
        nom: 'Your name', email: 'Your email', mdp: 'Password',
        btn: 'Sign up',
        lien: 'Already have an account? <a href="login.html">Log in</a>',
        succes: 'Account created successfully!',
        erreur: 'Server connection error'
      }
    };

    document.getElementById('nom').placeholder = t[langue].nom;
    document.getElementById('email').placeholder = t[langue].email;
    document.getElementById('mot_de_passe').placeholder = t[langue].mdp;
    document.getElementById('btn-submit').textContent = t[langue].btn;
    document.getElementById('lien-login').innerHTML = t[langue].lien;

    async function inscrire() {
      const nom = document.getElementById('nom').value;
      const email = document.getElementById('email').value;
      const mot_de_passe = document.getElementById('mot_de_passe').value;
      const message = document.getElementById('message');
      try {
        const response = await fetch(API + '/auth/inscription', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nom, email, mot_de_passe })
        });
        const data = await response.json();
        if (response.ok) {
          message.style.color = '#4caf50';
          message.textContent = t[langue].succes;
          setTimeout(() => window.location.href = 'login.html', 1500);
        } else {
          message.style.color = '#e94560';
          message.textContent = data.message;
        }
      } catch (err) {
        message.style.color = '#e94560';
        message.textContent = t[langue].erreur;
      }
    }
  </script>
</body>
</html>
